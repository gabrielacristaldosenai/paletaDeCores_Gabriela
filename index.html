<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de Cores</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Press+Start+2P&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <h1 style="color: azure;">Paleta de Cores</h1>
    <div id="telaPintura"></div>
    <h3></h3>
    <p>Clique em uma das cores abaixo para pintar a tela</p>
    <div id="paleta">
        <div id="pincelVermelho" class="pincel" style="background-color: rgb(192, 1, 1);"></div>
        <div id="pincelLaranja" class="pincel" style="background-color: rgb(228, 150, 6);"></div>
        <div id="pincelAmarelo" class="pincel" style="background-color: rgb(255, 221, 26);"></div>
        <div id="pincelVerde" class="pincel" style="background-color: rgb(18, 110, 18);"></div>
        <div id="pincelAzul" class="pincel" style="background-color: rgb(15, 15, 171);"></div>
        <div id="pincelRoxo" class="pincel" style="background-color: rgb(102, 63, 141);"></div>
        <div id="pincelRosa" class="pincel" style="background-color: rgb(172, 43, 151);"></div>
        <div id="pincelMarrom" class="pincel" style="background-color: rgb(116, 43, 17);"></div>
        <div id="pincelPreto" class="pincel" style="background-color: rgb(0, 0, 0);"></div>
        <div id="pincelBranco" class="pincel" style="background-color: rgb(255, 255, 255);"></div>
    </div>

<script src="script.js"></script>
</body>
</html>
